# Local/containerized deployment.
# Secrets are read from a sibling `.env` file (see .env.example) — never hardcode
# them here. The AI service is intentionally NOT published to the host; only the
# backend can reach it over the internal network.

services:
  mongodb:
    image: mongo:7.0
    container_name: research-scholar-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: research_scholar_agent
    networks:
      - research-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: research-scholar-ai
    restart: unless-stopped
    # No host port mapping — reachable only as http://ai-service:8000 internally.
    expose:
      - '8000'
    environment:
      - PORT=8000
      - DEBUG=False
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SEMANTIC_SCHOLAR_API_KEY=${SEMANTIC_SCHOLAR_API_KEY:-}
      - AI_SERVICE_SECRET=${AI_SERVICE_SECRET:?set AI_SERVICE_SECRET in your .env}
      - AI_ALLOWED_ORIGINS=http://backend:5000,http://localhost:5000
    networks:
      - research-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: research-scholar-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/research_scholar_agent}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in your .env}
      - JWT_EXPIRE=7d
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_SERVICE_SECRET=${AI_SERVICE_SECRET:?set AI_SERVICE_SECRET in your .env}
      - SEMANTIC_SCHOLAR_API_KEY=${SEMANTIC_SCHOLAR_API_KEY:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - mongodb
      - ai-service
    networks:
      - research-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: research-scholar-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - backend
    networks:
      - research-network

networks:
  research-network:
    driver: bridge

volumes:
  mongodb_data:
